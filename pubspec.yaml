name: keo_mobile
description: KEO - Vuot Phong Tuyen offline Flutter + Flame game
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  shared_preferences: ^2.3.2
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  flutter_screenutil: ^5.9.3
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
